name: CI — Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: famores-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check checkout client syntax
        run: node --check public/js/checkout-v2.js

      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start > /tmp/famores-server.log 2>&1 &

      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              echo "Famores production server responded successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready"
          cat /tmp/famores-server.log || true
          exit 1

      - name: Smoke public checkout page
        run: curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null

      - name: Smoke payment result page
        run: curl --fail --silent --show-error http://127.0.0.1:3000/pago/resultado > /dev/null

      - name: Smoke checkout configuration API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/checkout-config \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(!v||typeof v!=='object')process.exit(1)})"

      - name: Verify legacy processing endpoint stays disabled
        run: |
          status=$(curl --request POST --silent --output /tmp/procesar-body.txt --write-out '%{http_code}' http://127.0.0.1:3000/procesar)
          test "$status" = "410" || { echo "Expected POST /procesar HTTP 410, got $status"; cat /tmp/procesar-body.txt; exit 1; }

      - name: Stop server
        if: always()
        run: pkill -f "dist/server/entry.mjs" || true
