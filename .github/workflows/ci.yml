name: CI — Build and Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: famores-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start > /tmp/famores-server.log 2>&1 &

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              echo "Famores production server responded successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready"
          cat /tmp/famores-server.log || true
          exit 1

      - name: Stop server
        if: always()
        run: pkill -f "dist/server/entry.mjs" || true
