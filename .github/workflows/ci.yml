name: CI — Release Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: famores-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Regenerate lockfile for runtime upgrade
        if: github.event_name == 'pull_request' && github.head_ref == 'ci/release-gate-20260814'
        run: |
          npm install --package-lock-only
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh lockfile after Astro security upgrade"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check checkout client syntax
        run: node --check public/js/checkout-v2.js

      - name: Build
        run: npm run build

      - name: Start production server
        run: npm run start > /tmp/famores-server.log 2>&1 &

      - name: Wait for production server
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              echo "Famores production server responded successfully"
              exit 0
            fi
            sleep 2
          done
          echo "Server did not become ready"
          cat /tmp/famores-server.log || true
          exit 1

      - name: Smoke public checkout page
        run: curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null

      - name: Smoke payment result page
        run: curl --fail --silent --show-error http://127.0.0.1:3000/pago/resultado > /dev/null

      - name: Smoke checkout configuration API
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/api/checkout-config \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const v=JSON.parse(s);if(!v||typeof v!=='object')process.exit(1)})"

      - name: Verify legacy processing endpoint stays disabled
        run: |
          status=$(curl --request POST --silent --output /tmp/procesar-body.txt --write-out '%{http_code}' http://127.0.0.1:3000/procesar)
          case "$status" in
            404|410) echo "Legacy POST /procesar remains disabled (HTTP $status)" ;;
            *) echo "Legacy POST /procesar unexpectedly reachable: HTTP $status"; cat /tmp/procesar-body.txt; exit 1 ;;
          esac

      - name: Stop server
        if: always()
        run: pkill -f "dist/server/entry.mjs" || true
